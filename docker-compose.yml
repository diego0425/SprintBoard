services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sprintboard-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"

    ports:
      - "1433:1433"

    volumes:
      - sprintboard-sql-data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: SprintBoard.api/Dockerfile

    image: sprintboard-api
    container_name: sprintboard-api

    depends_on:
      sqlserver:
        condition: service_healthy

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__Default: >
        Server=sqlserver,1433;
        Database=SprintBoardDb;
        User Id=sa;
        Password=${SA_PASSWORD};
        TrustServerCertificate=True;
        Encrypt=False

      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "SprintBoard"
      Jwt__Audience: "SprintBoard.Client"
      Jwt__ExpiresMinutes: "60"

      Email__SmtpUsername: "${SMTP_USERNAME}"
      Email__SmtpPassword: "${SMTP_PASSWORD}"
      Email__FrontendBaseUrl: "http://localhost:3000"

    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: sprintboard-web/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1

    image: sprintboard-web
    container_name: sprintboard-web

    depends_on:
      - api

    ports:
      - "3000:80"

volumes:
  sprintboard-sql-data: