name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # BACKEND
  # ============================================================

  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore SprintBoard.api.slnx

      - name: Build solution
        run: >
          dotnet build SprintBoard.api.slnx
          --configuration Release
          --no-restore

      - name: Run tests
        run: >
          dotnet test SprintBoard.Test/SprintBoard.Test.csproj
          --configuration Release
          --no-build

  # ============================================================
  # FRONTEND
  # ============================================================

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sprintboard-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sprintboard-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  # ============================================================
  # DOCKER
  # ============================================================

  docker:
    name: Docker
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    env:
      SA_PASSWORD: "SprintBoard_CI_2026!SecurePassword"
      JWT_KEY: "SprintBoard.CI.Jwt.Key.2026.SuperSecureKey.For.Automated.Builds"
      SMTP_USERNAME: "ci-user"
      SMTP_PASSWORD: "ci-password"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build API image
        run: docker compose build api

      - name: Build frontend image
        run: docker compose build frontend